name: Demo capture

# Manually triggered: boots an emulator, drives the app with scripts/demo-capture.sh and
# uploads screenshots plus a GIF for the README (download the "demo-media" artifact).
on:
  workflow_dispatch:
  pull_request:
    paths:
      - scripts/demo-capture.sh
      - .github/workflows/demo.yml

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew --console=plain :app:assembleDebug

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run app on emulator and capture
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          # Keep animations on so the login animation shows up in the recording.
          disable-animations: false
          script: bash scripts/demo-capture.sh demo-output

      - name: Convert recording to GIF
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          ffmpeg -y -loglevel error -i demo-output/demo.mp4 \
            -vf "fps=12,scale=320:-1:flags=lanczos,split[a][b];[a]palettegen=stats_mode=diff[p];[b][p]paletteuse=dither=bayer:bayer_scale=4" \
            demo-output/demo.gif
          ls -la demo-output

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: demo-media
          path: demo-output/
