plugins {
    id 'com.android.application'
}

android {
    // Kept from the original Eclipse project: the R class and the Appium locators use this package.
    namespace = 'com.sheikbro.onlinechat'
    compileSdk = 36

    defaultConfig {
        applicationId = 'com.sheikbro.onlinechat'
        minSdk = 23
        // 35+ forces edge-to-edge drawing, which the legacy Holo layouts were not designed for.
        targetSdk = 34
        versionCode = 2
        versionName = '2.0'
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}
